# LOCAL DEV ONLY. This file is not used in production.
#
# Production is two separate Dokploy Applications built from this repo:
#   classquest-api  Dockerfile=backend/Dockerfile,  build context=repo root
#   classquest-web  Dockerfile=frontend/Dockerfile, build context=frontend/,
#                   build-arg VITE_API_URL=<public api url>
# Dokploy rebuilds both on push to main via webhook.
#
# Usage:  docker compose up --build
#   api -> http://localhost:8000   (sqlite + uploads persist in ./.data)
#   web -> http://localhost:5173
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./.data:/data
      # Live code: edits under backend/app land in the container. The image
      # CMD does not hot-reload (--workers 1, see Dockerfile); restart the
      # service, or uncomment the line below for dev-only auto reload.
      - ./backend/app:/app/app
    # command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
