# Guards merges only. Dokploy deploys on push via webhook, independently.
name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'fixtures/**'
      - 'scripts/check-fixtures-sync.sh'
      - '.github/workflows/frontend.yml'
  # No paths filter on pull_request on purpose: these two report the status checks
  # that gate a merge, and a required check that never runs leaves a PR blocked
  # forever waiting for it. The jobs take well under a minute and the repo is
  # public, so running them on every PR costs nothing worth saving.
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Fixtures in sync with the frontend copy
        working-directory: .
        run: bash scripts/check-fixtures-sync.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build
