# Guards merges only. Dokploy deploys on push via webhook, independently.
name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'schema/**'
      - 'fixtures/**'
      - 'scripts/check-fixtures-sync.sh'
      - '.github/workflows/backend.yml'
  # No paths filter on pull_request on purpose: these two report the status checks
  # that gate a merge, and a required check that never runs leaves a PR blocked
  # forever waiting for it. The jobs take well under a minute and the repo is
  # public, so running them on every PR costs nothing worth saving.
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Fixtures in sync with the frontend copy
        working-directory: .
        run: bash scripts/check-fixtures-sync.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Validate fixtures against schema
        working-directory: .
        run: python schema/validate.py

      - name: Test
        env:
          LLM_API_KEY: ''
          JWT_SECRET: ci-secret
          DATA_DIR: /tmp/cq-ci
          SEED_DEMO: 'false'
        run: pytest -q
