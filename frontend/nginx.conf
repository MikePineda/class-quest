# Static SPA server for the Vite build. Overrides nginx:alpine's default.conf.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Security headers.
    #
    # `add_header` does NOT merge across levels: a location block with even one
    # `add_header` of its own drops every inherited one. That is why the set is
    # repeated below rather than declared once here — losing it silently on the
    # two cached locations is exactly the failure this comment exists to stop.
    #
    # The CSP names no host on purpose (see CLAUDE.md: no domain names in
    # source). `connect-src` therefore has to be `https:` rather than the API's
    # own origin, which still refuses plaintext and non-HTTP schemes.
    # `style-src` allows inline because React injects the visual-novel
    # stylesheet as a <style> element at runtime.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:" always;

    # The entry HTML must never be cached: it is what points at the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https:" always;
    }

    # Vite emits content-hashed filenames under /assets, safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
